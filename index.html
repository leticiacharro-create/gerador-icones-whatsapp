<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Ícones | WhatsApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #22c55e;
            --primary-hover: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 1) 0px, transparent 50%);
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 36px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            backdrop-filter: blur(12px);
        }

        @media (max-width: 768px) {
            .app-card {
                grid-template-columns: 1fr;
                padding: 24px;
                gap: 32px;
            }
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        select:hover, select:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.15);
        }

        .select-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
        }

        .dropzone {
            border: 2px dashed var(--card-border);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .dropzone:hover {
            border-color: var(--primary);
            background: rgba(34, 197, 94, 0.04);
        }

        .dropzone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .dropzone-icon {
            width: 36px;
            height: 36px;
            margin: 0 auto 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .dropzone-text {
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .dropzone-subtext {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn-download {
            margin-top: 8px;
            padding: 16px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(34, 197, 94, 0.35);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .preview-container {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .preview-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-header::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        .canvas-frame {
            position: relative;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        canvas {
            border-radius: 50%;
            display: block;
            width: 260px;
            height: 260px;
            background-color: #000000;
        }

        .preview-tag {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .file-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--primary);
            margin-top: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- Coluna de Controles -->
        <div class="section">
            <div>
                <h1 class="header-title">Gerador de Ícones</h1>
                <p class="header-subtitle">Padronização automática para grupos de clientes no WhatsApp.</p>
            </div>

            <div class="form-group">
                <label>1. Evento</label>
                <div class="select-wrapper">
                    <select id="eventSelect">
                        <option value="cmo">CMO Summit (Fundo Preto)</option>
                        <option value="rh">RH Summit (Fundo Rosa)</option>
                        <option value="mdmkt">Mundo do Marketing (Fundo Roxo)</option>
                        <option value="td">TD (Fundo Preto)</option>
                        <option value="td_scale">TD SCALE (Fundo Verde Água)</option>
                    </select>
                    <div class="select-arrow">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>2. Logo do Cliente</label>
                <div class="dropzone">
                    <input type="file" id="clientLogo" accept="image/png, image/jpeg, image/svg+xml">
                    <div class="dropzone-icon">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    </div>
                    <div class="dropzone-text" id="dropzoneText">Arraste ou clique para enviar o logo</div>
                    <div class="dropzone-subtext">Suporta arquivos SVG, PNG ou JPG</div>
                </div>
                <div class="file-status" id="fileStatus">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span id="fileName">Arquivo carregado com sucesso</span>
                </div>
            </div>

            <button class="btn-download" id="downloadBtn">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Baixar Imagem Formatada
            </button>
        </div>

        <!-- Coluna de Preview -->
        <div class="preview-container">
            <div class="preview-header">Pré-visualização do Perfil</div>
            
            <div class="canvas-frame">
                <canvas id="canvas" width="640" height="640"></canvas>
            </div>

            <div class="preview-tag">640 x 640 px • Corte Circular</div>
        </div>
    </div>

        eventSelect.addEventListener('change', function() {
            const config = eventConfig[this.value];
            if (config) {
                eventImg.src = config.logoSrc; 
                currentBgColor = config.bgColor;
                currentClientLogoColor = config.clientLogoColor;
                currentEventLogoColor = config.eventLogoColor || config.clientLogoColor;
                currentLineColor = config.lineColor || 'rgba(255, 255, 255, 0.3)';
                applyEventFilter = config.applyEventFilter;
                
                if (eventImg.complete) {
                    drawCanvas();
                }
            }
        });

        clientLogoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                dropzoneText.textContent = file.name;
                fileNameSpan.textContent = file.name;
                fileStatus.style.display = 'flex';

                const reader = new FileReader();
                reader.onload = function(event) {
                    clientImg.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function drawCanvas() {
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Definições Absolutas de Posicionamento Centralizado Perfeito (tipo Figma)
            const canvasCenterX = canvas.width / 2;
            const canvasCenterY = canvas.height / 2; // Y = 320 (Linha do meio)
            
            const lineY = canvasCenterY;
            const lineWidth = 260; // Largura do traço separador

            const logoMaxWidth = 320;
            const logoMaxHeight = 130;
            
            // Distância exata do centro da tela para o centro do logo superior e inferior.
            // Y de Cima = 320 - 105 = 215. Y de Baixo = 320 + 105 = 425
            // Isso garante simetria visual milimétrica ao redor da linha central
            const offsetFromCenter = 105; 

            // 1. Desenha o Logo do Evento
            if (eventImg.src && eventImg.complete && eventImg.naturalWidth !== 0) {
                drawImageCentered(
                    eventImg, 
                    canvasCenterX, 
                    canvasCenterY - offsetFromCenter, 
                    logoMaxWidth, 
                    logoMaxHeight, 
                    applyEventFilter, 
                    currentEventLogoColor, 
                    eventSelect.value
                );
            }
            
            // 2. Desenha o Logo do Cliente
            if (clientImg.src && clientImg.complete && clientImg.naturalWidth !== 0) {
                drawImageCentered(
                    clientImg, 
                    canvasCenterX, 
                    canvasCenterY + offsetFromCenter, 
                    logoMaxWidth, 
                    logoMaxHeight, 
                    true, 
                    currentClientLogoColor, 
                    'client'
                );
            }
            
            // 3. Desenha a Linha Divisória
            if (eventImg.src && clientImg.src && eventImg.complete && clientImg.complete) {
                ctx.beginPath();
                ctx.moveTo(canvasCenterX - (lineWidth / 2), lineY);
                ctx.lineTo(canvasCenterX + (lineWidth / 2), lineY);
                ctx.strokeStyle = currentLineColor;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawImageCentered(img, centerX, centerY, maxWidth, maxHeight, applyColorFilter, fillColor, imgType) {
            let scaleMultiplier = 1.0;
            
            // Ajustes finos ópticos dependendo da proporção horizontal da marca do evento
            if (imgType === 'mdmkt') scaleMultiplier = 1.3;
            else if (imgType === 'td_scale') scaleMultiplier = 1.15;
            else if (imgType === 'td') scaleMultiplier = 1.15;

            let scale = Math.min(maxWidth / img.width, maxHeight / img.height) * scaleMultiplier;
            
            let newWidth = img.width * scale;
            let newHeight = img.height * scale;
            
            // Posicionamento baseando no CENTRO do bloco e não nas bordas
            let drawX = centerX - (newWidth / 2);
            let drawY = centerY - (newHeight / 2);
            
            if (applyColorFilter) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = newWidth;
                tempCanvas.height = newHeight;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.drawImage(img, 0, 0, newWidth, newHeight);
                tempCtx.globalCompositeOperation = 'source-in';
                tempCtx.fillStyle = fillColor;
                tempCtx.fillRect(0, 0, newWidth, newHeight);
                
                ctx.drawImage(tempCanvas, drawX, drawY);
            } else {
                ctx.drawImage(img, drawX, drawY, newWidth, newHeight);
            }
        }

        downloadBtn.addEventListener('click', function() {
            if (!clientImg.src) {
                alert("Por favor, faça o upload do logo do cliente antes de baixar.");
                return;
            }
            
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            
            let eventName = 'Evento';
            if (eventSelect.value === 'cmo') eventName = 'CMO-Summit';
            else if (eventSelect.value === 'rh') eventName = 'RH-Summit';
            else if (eventSelect.value === 'mdmkt') eventName = 'Mundo-do-Marketing';
            else if (eventSelect.value === 'td') eventName = 'TD';
            else if (eventSelect.value === 'td_scale') eventName = 'TD-Scale';
            
            link.download = `icone-whatsapp-${eventName}.png`;
            
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        eventSelect.dispatchEvent(new Event('change'));
